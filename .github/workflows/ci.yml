# Runs on every push and pull request. Needs no secrets: it never touches the database.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, security check, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the website
        run: npm run build
      - name: No secrets in the code or the browser bundle
        run: npm run check:security
      - name: No known high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: API files load without errors
        run: for f in api/*.js; do node -e "import('./$f')" || exit 1; done
